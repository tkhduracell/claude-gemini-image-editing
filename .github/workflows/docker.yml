name: Docker

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR, not Docker Hub: it authenticates with the built-in GITHUB_TOKEN, so
  # there is no secret to configure and a fork publishes to its own namespace.
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/gemini-image

jobs:
  # PRs: build only, single-arch, no registry login and no push. This catches
  # a broken Dockerfile without needing any secret, so it works on forks too.
  build:
    name: Build (amd64, no push)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag pushes: multi-arch build and push to GHCR. GITHUB_TOKEN is always
  # present, so unlike a secret-gated push this can never silently no-op.
  publish:
    name: Build and push (amd64 + arm64)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags from the git tag
        id: meta
        env:
          # refs/tags/v0.2.0 -> 0.2.0
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:${VERSION} and ${IMAGE}:latest"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "A new GHCR package is private by default — make it public in"
            echo "the repo's Packages settings so \`/plugin install\` can pull it."
          } >> "$GITHUB_STEP_SUMMARY"
